name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # the Dependabot gate starts the main build this way
# Actions are pinned to commit SHAs: tags can be moved or deleted (trivy-action's were).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t argus:ci --build-arg COMMIT=${{ github.sha }} .
      - name: Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: argus:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test
        run: |
          mkdir -p cfg && printf 'checks:\n  - {name: self, kind: tcp, target: "127.0.0.1:8080", interval: 10}\n' > cfg/argus.yml
          docker run -d --name argus -p 8080:8080 -v "$PWD/cfg:/config:ro" -e ARGUS_DB=/tmp/argus.db argus:ci
          for _ in $(seq 30); do curl -skf https://localhost:8080/healthz && break; sleep 1; done
          sleep 12
          curl -skf https://localhost:8080/metrics | grep 'argus_check_up{check="self"' | grep ' 1.0$'
          curl -skf https://localhost:8080/ | grep -q '<title>Argus</title>'
          curl -skfI https://localhost:8080/ | grep -qi "content-security-policy: default-src 'self'"
          # Fresh install: a setup code in the log, settings closed without a session.
          docker logs argus 2>&1 | grep -q 'Setup code: '
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X PUT https://localhost:8080/api/alerts)" = 401
          docker exec argus python -m argus healthcheck
          docker logs argus 2>&1 | grep -v 'Setup code'
      - name: Starts with no config at all, over plain HTTP when told
        run: |
          docker run -d --name bare -p 8081:8080 -e ARGUS_TLS=off -e ARGUS_DB=/tmp/argus.db argus:ci
          for _ in $(seq 30); do curl -sf localhost:8081/healthz && break; sleep 1; done
          curl -sf localhost:8081/api/info | grep -q '"sender":"argus"'
          docker exec bare python -m argus healthcheck
      - name: A host added with one command shows its containers and disks
        run: |
          # The admin: the setup code from the log, then "Add a host" as the UI does it.
          code=$(docker logs argus 2>&1 | grep -o 'Setup code: [0-9a-f-]*' | tail -1 | cut -d' ' -f3)
          csrf=$(curl -sk -c jar -H 'content-type: application/json' \
            -d "{\"code\":\"$code\",\"password\":\"ci password for the smoke test\"}" \
            https://localhost:8080/api/setup | jq -r .csrf)
          cmd=$(curl -sk -b jar -H "X-CSRF-Token: $csrf" -H 'content-type: application/json' \
            -d '{"url":"https://localhost:8080","name":"runner"}' \
            https://localhost:8080/api/companions/codes | jq -r .command)
          echo "$cmd" | grep -q -- '--pinnedpubkey sha256//'
          # The one command, exactly as shown, on this runner (it has Docker and systemd).
          sh -c "$cmd"
          for _ in $(seq 30); do
            curl -sk https://localhost:8080/api/companions > hosts.json
            jq -e '.companions[0].status == "ok"' hosts.json >/dev/null && break; sleep 2
          done
          if ! jq -e '.companions[0].status == "ok"' hosts.json >/dev/null; then
            cat hosts.json; sudo journalctl -u argus-companion --no-pager | tail -30
            sudo /usr/local/bin/argus-companion report | head -c 3000; exit 1
          fi
          jq '.companions[0] | {name, status, containers: [.report.containers[].name], disks: [.report.disks[].mount]}' hosts.json
          jq -e '.companions[0].report.containers | map(.name) | index("argus")' hosts.json
          jq -e '.companions[0].report.disks | map(.mount) | index("/")' hosts.json
          systemctl is-active argus-companion
          # Removing the host revokes its token: the companion says so in its log.
          id=$(jq -r '.companions[0].id' hosts.json)
          curl -skf -b jar -H "X-CSRF-Token: $csrf" -X DELETE https://localhost:8080/api/companions/$id
          sudo /usr/local/bin/argus-companion run --once 2>&1 | grep -q 'HTTP 401'
      # No image push yet: v2 publishes to GHCR at launch (milestone M6).

  gate:
    needs: [test, image]
    permissions:
      contents: write
      pull-requests: write
      actions: write
    # Shared: patch/minor Dependabot PRs merge on green, majors wait for Devin.
    uses: DevinMB/workflows/.github/workflows/dependabot-gate.yml@main
